name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          AUTHOR_URL: ${{ vars.AUTHOR_URL }}
          NEXT_PUBLIC_CHECKOUT_API: ${{ vars.NEXT_PUBLIC_CHECKOUT_API }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: e2e-evidence
          path: |
            playwright-report
            test-results
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: site
          path: out
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 3

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-site-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: out
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/deploy-bunny.mjs
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}
          BUNNY_PULL_ZONE_ID: ${{ vars.BUNNY_PULL_ZONE_ID }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}

  deploy-function:
    needs: checks
    if: github.ref == 'refs/heads/main' && vars.CHECKOUT_WORKER_NAME != '' && vars.SITE_URL != ''
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    concurrency:
      group: deploy-function-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Verify deployment secrets are set
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::missing secret $name"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler deploy --name "$CHECKOUT_WORKER_NAME" --var "SITE_URL:$SITE_URL"
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CHECKOUT_WORKER_NAME: ${{ vars.CHECKOUT_WORKER_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
